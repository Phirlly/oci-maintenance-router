schemaVersion: "1.1.0"
title: OCI Maintenance Router — PREVIEW
description: Prepare maintenance history without sending notifications.
informationalText: This PREVIEW reads announcements and prepares maintenance history for your selected scope. It does not send PagerDuty alerts or enable delivery.
variableGroups:
  - title: Placement
    variables: ["${environment_name}", "${compartment_ocid}"]
  - title: MySQL scope
    variables: ["${mysql_regions}", "${mysql_compartments}"]
  - title: Ownership tag
    variables: ["${ownership_kind}", "${ownership_namespace}", "${ownership_key}"]
  - title: PagerDuty destinations
    variables: ["${pagerduty_region}", "${secret_compartment_ocid}", "${destinations}", "${routes}"]
  - title: Network
    variables: ["${create_network}", "${network_cidr}", "${network_compartment_ocid}", "${existing_vcn_ocid}", "${existing_subnet_ocid}"]
variables:
  tenancy_ocid:
    type: string
    visible: false
  region:
    type: string
    visible: false
  environment_name:
    type: string
    title: Environment name
    description: Unique, stable name for this deployment. Use lowercase letters, digits and hyphens. Changing it requires replacing protected storage.
    required: true
    pattern: "^[a-z0-9][a-z0-9-]{0,31}$"
  compartment_ocid:
    type: oci:identity:compartment:id
    title: Router compartment
    description: Create the router here. Select existing MySQL locations below, in this same tenancy. No database is created.
    required: true
  mysql_regions:
    type: list
    valueType: mysql_region
    title: MySQL regions
    description: Add each subscribed region to include.
    required: true
  mysql_region:
    type: oci:identity:region:name
    title: MySQL region
    description: Select a region containing databases to include. Use Add Item for another region.
    required: true
    visible: false
  mysql_compartments:
    type: list
    valueType: mysql_compartment
    title: MySQL compartments
    description: Add each compartment to include. Child compartments are not automatically included.
    required: true
  mysql_compartment:
    type: oci:identity:compartment:id
    title: MySQL compartment
    description: Select child compartments separately. When editing, reselect all intended compartments if saved rows appear blank. Check Review before saving.
    required: true
    visible: false
  ownership_kind:
    type: enum
    enum: [defined, freeform]
    default: defined
    title: Tag type
    description: Match the tag on your databases. Defined tags have a namespace; freeform tags do not.
    required: true
  ownership_namespace:
    type: string
    title: Defined-tag namespace
    description: Enter the namespace containing your ownership tag, for example Operations.
    required: true
    visible:
      eq: ["${ownership_kind}", defined]
    minLength: 1
    maxLength: 100
  ownership_key:
    type: string
    title: Ownership tag key
    description: For a tag such as team=payments-api, enter team here and map payments-api to a destination below. Match the tag spelling exactly.
    required: true
    minLength: 1
    maxLength: 100
  pagerduty_region:
    type: enum
    enum: [US, EU]
    default: US
    title: PagerDuty account region
    description: Select the region of your PagerDuty account, independently of the OCI deployment region.
    required: true
  secret_compartment_ocid:
    type: oci:identity:compartment:id
    title: Vault secret compartment
    description: "Choose the compartment containing your secrets in the stack region. Reuse an existing secret or <a href='https://docs.oracle.com/en-us/iaas/Content/secret-management/Tasks/create-secret.htm'>create one in Vault</a>. This nonsending PREVIEW can use harmless dummy content; no real PagerDuty key is needed."
    default: ${compartment_ocid}
    required: true
  destinations:
    type: map
    valueType: destination_secret
    title: "Destinations: name → Vault secret"
    description: Give each destination a stable lowercase name, then select its existing Vault secret in the stack region. Never paste integration keys.
    required: true
  destination_secret:
    type: oci:kms:secret:id
    description: "Left: name this destination, for example payments (1–32 lowercase letters, digits or hyphens, starting with a letter or digit). Right: select its Vault secret. Never paste an integration key. When editing, reselect blank secrets and check Review before saving."
    required: true
    visible: false
    dependsOn:
      compartmentId: ${secret_compartment_ocid}
  routes:
    type: map
    valueType: destination_name
    title: "Routes: ownership tag value → destination name"
    description: Enter an exact ownership tag value and a destination name from above. Values are case-sensitive and must already use Unicode NFC; ASCII values are unaffected.
    required: true
  destination_name:
    type: string
    description: "Left: the exact tag value, for example payments-api. Right: its destination name from above, for example payments. Multiple tag values can use the same destination. Non-ASCII tag values must already use Unicode NFC."
    required: true
    visible: false
    # Terraform validates destinations; native child patterns retain errors after row removal.
  create_network:
    type: boolean
    title: Create a new network
    description: Leave selected to create a private VCN and subnet for the router. Clear to use an existing VCN and private regional subnet.
    default: true
  network_cidr:
    type: string
    title: New network address range (CIDR)
    description: Address range for the new private network. Keep the default unless your network policy requires a different range.
    default: 10.77.0.0/24
    required: true
    visible: ${create_network}
  network_compartment_ocid:
    type: oci:identity:compartment:id
    title: Existing network compartment
    description: Select the compartment containing your existing VCN and subnet.
    default: ${compartment_ocid}
    required: true
    visible:
      not: ["${create_network}"]
  existing_vcn_ocid:
    type: oci:core:vcn:id
    title: Existing VCN
    description: Select the VCN containing your existing private subnet.
    required: true
    visible:
      not: ["${create_network}"]
    dependsOn:
      compartmentId: ${network_compartment_ocid}
  existing_subnet_ocid:
    type: oci:core:subnet:id
    title: Existing private regional subnet
    description: Must already permit DNS and HTTPS to regional Announcements and Object Storage. Shared routes and security rules are not changed.
    required: true
    visible:
      not: ["${create_network}"]
    dependsOn:
      compartmentId: ${network_compartment_ocid}
      vcnId: ${existing_vcn_ocid}
      hidePublicSubnet: true
      hideAdSubnet: true
outputs:
  installation_status:
    type: string
    title: PREVIEW preparation
  sending_enabled:
    type: boolean
    title: Notification delivery enabled
  function_id:
    type: string
    title: Function
  state_bucket:
    type: string
    title: Protected private storage
  check_result:
    type: string
    visible: false

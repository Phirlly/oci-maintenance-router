schemaVersion: "1.1.0"
title: OCI Maintenance Router
description: Route HeatWave MySQL maintenance notices by ownership tag.
informationalText: Development package; production acceptance remains incomplete. Do not use for production. Apply waits 5 minutes after IAM changes, then checks deployment.
variableGroups:
  - title: Deployment
    variables: ["${environment_name}", "${compartment_ocid}", "${create_network}", "${network_cidr}", "${network_compartment_ocid}", "${existing_vcn_ocid}", "${existing_subnet_ocid}"]
  - title: Resources to monitor (MySQL)
    variables: ["${mysql_regions}", "${mysql_compartments}"]
  - title: Tags and PagerDuty
    variables: ["${ownership_kind}", "${ownership_namespace}", "${ownership_key}", "${pagerduty_region}", "${secret_compartment_ocid}", "${destinations}", "${routes}"]
  - title: Router notifications
    variables: ["${operator_email}"]
  - title: Routing and setup
    variables: ["${routing_state}", "${setup_action}", "${setup_attempt}", "${test_secret_compartment_ocid}", "${test_secret_ocid}", "${test_nonproduction}", "${test_receipt_code}", "${operator_receipt_code}"]
  - title: "Advanced: sending recovery"
    variables: ["${recovery_review_code}", "${recovery_request_number}", "${recovery_confirm}"]
  - title: "Advanced: close saved work"
    variables: ["${closure_review_code}", "${closure_request_number}", "${closure_confirm}"]
variables:
  tenancy_ocid:
    type: string
    visible: false
  region:
    type: string
    visible: false
  environment_name:
    type: string
    title: Deployment name
    description: Unique, stable name for this deployment. Use lowercase letters, digits and hyphens. Changing it requires replacing protected storage.
    required: true
    pattern: "^[a-z0-9][a-z0-9-]{0,31}$"
  compartment_ocid:
    type: oci:identity:compartment:id
    title: Router compartment
    description: Create the router here. Select existing MySQL locations below, in this same tenancy. No database is created.
    required: true
  routing_state:
    type: enum
    enum: [Paused, Enabled]
    default: Paused
    title: Maintenance routing
    description: Start Paused to prepare history and set up notifications. Enable after confirming both tests. Pause before changing routing or scope; scheduled checks continue without sending.
    required: true
  setup_action:
    type: enum
    enum: [None, Send test, Confirm received tests]
    default: None
    title: Setup action
    description: Choose an action while routing is Paused. Confirm received tests sends nothing. Choose None for normal use.
    required: true
  setup_attempt:
    type: integer
    title: Test number
    description: Enter 1 for your first test. Keep the same number to retry or confirm. Increase it for another test or after changing the test service, email, PagerDuty region or package.
    required: false
    visible:
      not:
        - eq: ["${setup_action}", None]
  test_secret_compartment_ocid:
    type: oci:identity:compartment:id
    title: Test secret compartment
    description: Select the compartment containing your test secret in the stack region.
    required: false
    visible:
      or:
        - eq: ["${setup_action}", Send test]
        - and:
            - eq: ["${setup_action}", Confirm received tests]
            - eq: ["${operator_email}", ""]
  test_secret_ocid:
    type: oci:kms:secret:id
    title: Nonproduction PagerDuty secret
    description: Select the Vault secret for your test service. Never paste its key here. For PagerDuty-only confirmation, select the same secret used for that test. Reselect if blank when editing.
    required: false
    visible:
      or:
        - eq: ["${setup_action}", Send test]
        - and:
            - eq: ["${setup_action}", Confirm received tests]
            - eq: ["${operator_email}", ""]
    dependsOn:
      compartmentId: ${test_secret_compartment_ocid}
  test_nonproduction:
    type: boolean
    title: This service may receive a nonproduction test alert
    description: Confirm this test will not page production responders.
    default: false
    required: false
    visible:
      or:
        - eq: ["${setup_action}", Send test]
        - and:
            - eq: ["${setup_action}", Confirm received tests]
            - eq: ["${operator_email}", ""]
  test_receipt_code:
    type: string
    title: PagerDuty confirmation code
    description: Paste confirmation_code from the received PagerDuty test. Use the same test number. With an operator email configured, enter its code too.
    default: ""
    required: false
    visible:
      eq: ["${setup_action}", Confirm received tests]
  operator_email:
    type: string
    title: Router operator email
    description: Receives router problems separately from maintenance alerts. Required to enable routing. Apply while Paused with Setup action None, then confirm OCI's subscription email before sending tests. Without an email, testing checks PagerDuty only and cannot enable routing.
    default: ""
    required: false
  operator_receipt_code:
    type: string
    title: Operator email confirmation code
    description: Paste the code from the received operator test email. Confirm it together with the PagerDuty code using the same test number.
    default: ""
    required: false
    visible:
      and:
        - eq: ["${setup_action}", Confirm received tests]
        - not:
            - eq: ["${operator_email}", ""]
  closure_review_code:
    type: string
    title: Closure review code
    description: Paste the code from the final page of your selected saved-target review. Leave empty when no closure is needed.
    default: ""
    maxLength: 6000
    required: false
    visible: true
  closure_request_number:
    type: integer
    title: Closure request number
    description: Enter 1 for your first closure. Keep number and code unchanged to retry. Use a new number for new intent; history is kept per notice.
    required: false
    visible: true
  closure_confirm:
    type: boolean
    title: Close this saved work without sending
    description: Requires Paused routing and Setup action None. Closure preserves history and cannot be undone. Clear this checkbox and Apply to remove the request; pausing alone does not cancel it.
    default: false
    required: false
    visible: true
  recovery_review_code:
    type: string
    title: Recovery review code
    description: Paste the final code from review-recovery for the selected retry or revision approval. Leave empty when no recovery is needed.
    default: ""
    maxLength: 6000
    required: false
    visible: true
  recovery_request_number:
    type: integer
    title: Recovery request number
    description: Enter 1 for your first recovery. Keep number and code unchanged to retry. Use a new number for new intent; history is kept per notice.
    required: false
    visible: true
  recovery_confirm:
    type: boolean
    title: Authorize this reviewed sending recovery
    description: Requires Enabled routing and may send alerts. Approval authorizes recorded work; it does not prove delivery. Clear and Apply to remove the request. Already approved batches remain authorized.
    default: false
    required: false
    visible: true
  mysql_regions:
    type: list
    valueType: mysql_region
    title: MySQL regions
    description: Add each subscribed region to include.
    required: true
  mysql_region:
    type: oci:identity:region:name
    title: MySQL region
    description: Select a region containing databases to include. Use Add Item for another region.
    required: true
    visible: false
  mysql_compartments:
    type: list
    valueType: mysql_compartment
    title: MySQL compartments
    description: Add each compartment to include. Child compartments are not automatically included.
    required: true
  mysql_compartment:
    type: oci:identity:compartment:id
    title: MySQL compartment
    description: Select child compartments separately. When editing, reselect all intended compartments if saved rows appear blank. Check Review before saving.
    required: true
    visible: false
  ownership_kind:
    type: enum
    enum: [defined, freeform]
    default: defined
    title: Tag type
    description: Match the tag on your databases. Defined tags have a namespace; freeform tags do not.
    required: true
  ownership_namespace:
    type: string
    title: Defined-tag namespace
    description: Enter the namespace containing your ownership tag, for example Operations.
    required: true
    visible:
      eq: ["${ownership_kind}", defined]
    minLength: 1
    maxLength: 100
  ownership_key:
    type: string
    title: Ownership tag key
    description: For a tag such as team=payments-api, enter team here and map payments-api to a destination below. Match the tag spelling exactly.
    required: true
    minLength: 1
    maxLength: 100
  pagerduty_region:
    type: enum
    enum: [US, EU]
    default: US
    title: PagerDuty account region
    description: Select the region of your PagerDuty account, independently of the OCI deployment region.
    required: true
  secret_compartment_ocid:
    type: oci:identity:compartment:id
    title: Vault secret compartment
    description: "Choose the compartment containing your secrets in the stack region. Reuse an existing secret or <a href='https://docs.oracle.com/en-us/iaas/Content/secret-management/Tasks/create-secret.htm'>create one in Vault</a>. Enabled routing uses these destination keys. Paused routing does not read their contents; setup tests use the separate test secret."
    default: ${compartment_ocid}
    required: true
  destinations:
    type: map
    valueType: destination_secret
    title: "Destinations: name → Vault secret"
    description: Give each destination a stable lowercase name, then select its existing Vault secret in the stack region. Never paste integration keys.
    required: true
  destination_secret:
    type: oci:kms:secret:id
    description: "Left: name this destination, for example payments (1–32 lowercase letters, digits or hyphens, starting with a letter or digit). Right: select its Vault secret. Never paste an integration key. When editing, reselect blank secrets and check Review before saving."
    required: true
    visible: false
    dependsOn:
      compartmentId: ${secret_compartment_ocid}
  routes:
    type: map
    valueType: destination_name
    title: "Routes: ownership tag value → destination name"
    description: Enter an exact ownership tag value and a destination name from above. Values are case-sensitive and must already use Unicode NFC; ASCII values are unaffected.
    required: true
  destination_name:
    type: string
    description: "Left: the exact tag value, for example payments-api. Right: its destination name from above, for example payments. Multiple tag values can use the same destination. Non-ASCII tag values must already use Unicode NFC."
    required: true
    visible: false
    # Terraform validates destinations; native child patterns retain errors after row removal.
  create_network:
    type: boolean
    title: Create a new network
    description: Create a private VCN, subnet and outbound gateways for OCI and PagerDuty access. Clear to use an existing VCN and private regional subnet.
    default: true
  network_cidr:
    type: string
    title: New network address range (CIDR)
    description: Address range for the new private network. Keep the default unless your network policy requires a different range.
    default: 10.77.0.0/24
    required: true
    visible: ${create_network}
  network_compartment_ocid:
    type: oci:identity:compartment:id
    title: Existing network compartment
    description: Select the compartment containing your existing VCN and subnet.
    default: ${compartment_ocid}
    required: true
    visible:
      not: ["${create_network}"]
  existing_vcn_ocid:
    type: oci:core:vcn:id
    title: Existing VCN
    description: Select the VCN containing your existing private subnet.
    required: true
    visible:
      not: ["${create_network}"]
    dependsOn:
      compartmentId: ${network_compartment_ocid}
  existing_subnet_ocid:
    type: oci:core:subnet:id
    title: Existing private regional subnet
    description: Must permit DNS and HTTPS to Announcements, Object Storage, Vault and selected regional MySQL control APIs. Tests and Enabled routing need events.pagerduty.com (US) or events.eu.pagerduty.com (EU) and Notifications control and topic data endpoints. Shared routes and security rules are not changed.
    required: true
    visible:
      not: ["${create_network}"]
    dependsOn:
      compartmentId: ${network_compartment_ocid}
      vcnId: ${existing_vcn_ocid}
      hidePublicSubnet: true
      hideAdSubnet: true
outputs:
  recovery_verified:
    type: boolean
    title: Requested recovery verified by last Apply
  recovery_result:
    type: string
    visible: false
  closure_completed:
    type: boolean
    title: Requested closure verified by last Apply
  closure_result:
    type: string
    visible: false
  test_receipt_confirmed:
    type: boolean
    title: PagerDuty receipt confirmed by last check
  operator_receipt_confirmed:
    type: boolean
    title: Operator email receipt confirmed by last check
  operator_subscription_status:
    type: string
    title: Operator subscription (confirm OCI's email if PENDING)
  operator_test_status:
    type: string
    title: Last operator test (API acceptance only)
  routing_state:
    type: string
    title: Configured maintenance routing
  configured_mode:
    type: string
    visible: false
  test_submission_status:
    type: string
    title: Last test submission (API acceptance only)
  installation_status:
    type: string
    title: Last deployment check
  sending_enabled:
    type: boolean
    title: Routing activation verified by last Apply
  function_id:
    type: string
    title: Function
  state_bucket:
    type: string
    title: Protected private storage
  check_result:
    type: string
    visible: false

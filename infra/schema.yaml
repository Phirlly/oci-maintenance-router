schemaVersion: "1.1.0"
title: OCI Maintenance Router — Preview and Test
description: Prepare maintenance history or send and confirm a nonproduction test alert.
informationalText: PREVIEW prepares maintenance history. TEST sends or confirms a test alert to your selected nonproduction service. Maintenance notification delivery remains disabled.
variableGroups:
  - title: Placement
    variables: ["${environment_name}", "${compartment_ocid}"]
  - title: Operation
    variables: ["${mode}"]
  - title: PagerDuty test
    variables: ["${test_secret_compartment_ocid}", "${test_secret_ocid}", "${test_nonproduction}", "${test_run}", "${test_receipt_code}"]
  - title: Operator email
    variables: ["${operator_email}", "${operator_test_run}", "${operator_receipt_code}"]
  - title: Saved-work closure
    variables: ["${closure_review_code}", "${closure_request_number}", "${closure_confirm}"]
  - title: MySQL scope
    variables: ["${mysql_regions}", "${mysql_compartments}"]
  - title: Ownership tag
    variables: ["${ownership_kind}", "${ownership_namespace}", "${ownership_key}"]
  - title: PagerDuty destinations
    variables: ["${pagerduty_region}", "${secret_compartment_ocid}", "${destinations}", "${routes}"]
  - title: Network
    variables: ["${create_network}", "${network_cidr}", "${network_compartment_ocid}", "${existing_vcn_ocid}", "${existing_subnet_ocid}"]
variables:
  tenancy_ocid:
    type: string
    visible: false
  region:
    type: string
    visible: false
  environment_name:
    type: string
    title: Environment name
    description: Unique, stable name for this deployment. Use lowercase letters, digits and hyphens. Changing it requires replacing protected storage.
    required: true
    pattern: "^[a-z0-9][a-z0-9-]{0,31}$"
  compartment_ocid:
    type: oci:identity:compartment:id
    title: Router compartment
    description: Create the router here. Select existing MySQL locations below, in this same tenancy. No database is created.
    required: true
  mode:
    type: enum
    enum: [PREVIEW, PAUSED, TEST]
    default: PREVIEW
    title: Mode
    description: PREVIEW prepares history without alerts. PAUSED stops automatic work but permits confirmed closure below. Saved test settings are used only in TEST, which sends or confirms a nonproduction test.
    required: true
  test_secret_compartment_ocid:
    type: oci:identity:compartment:id
    title: Test secret compartment
    description: For TEST, select the compartment containing your test secret in the stack region.
    required: false
    visible: true
  test_secret_ocid:
    type: oci:kms:secret:id
    title: Nonproduction PagerDuty secret
    description: Required in TEST. Select a Vault secret containing your nonproduction Events API V2 key. Never paste the key here. Reselect if blank when editing.
    required: false
    visible: true
    dependsOn:
      compartmentId: ${test_secret_compartment_ocid}
  test_nonproduction:
    type: boolean
    title: This service may receive a nonproduction test alert
    description: Required in TEST. Confirm this test will not page production responders.
    default: false
    required: false
    visible: true
  test_run:
    type: integer
    title: Test run number
    description: Required in TEST. Enter 1 for your first test. Keep unchanged to retry or confirm receipt. For another test, including after a service, PagerDuty region or package change, clear both confirmation codes and increase the number.
    required: false
    visible: true
  test_receipt_code:
    type: string
    title: PagerDuty confirmation code (optional)
    description: In TEST, paste confirmation_code from the received PagerDuty test. Keep test numbers unchanged. If operator email is configured, enter its code too; confirmation sends nothing.
    default: ""
    required: false
    visible: true
  operator_email:
    type: string
    title: Operator email (optional)
    description: Apply in PREVIEW or PAUSED, then confirm OCI's email before TEST. Changing the address requires confirmation again. Clear to remove this subscription.
    default: ""
    required: false
  operator_test_run:
    type: integer
    title: Operator test run number
    description: Required in TEST with an operator email. Enter 1 for the first test. Keep unchanged to retry or confirm receipt. For another test or a changed email/subscription, clear both confirmation codes and use a new number.
    required: false
    visible: true
  operator_receipt_code:
    type: string
    title: Operator email confirmation code (optional)
    description: In TEST, paste the code from the received operator test email, together with the PagerDuty code. Keep test numbers unchanged. Clear this code if removing operator email.
    default: ""
    required: false
    visible: true
  closure_review_code:
    type: string
    title: Closure review code
    description: Paste the code from the final page of your selected saved-target review. Leave empty when no closure is needed.
    default: ""
    maxLength: 6000
    required: false
    visible: true
  closure_request_number:
    type: integer
    title: Closure request number
    description: Enter 1 for your first closure. Keep number and code unchanged to retry. Use a new number for new intent; history is kept per notice.
    required: false
    visible: true
  closure_confirm:
    type: boolean
    title: Close this saved work without sending
    description: Requires PAUSED. Closure preserves history and cannot be undone. Clear this checkbox and Apply to remove the request; PAUSED alone does not cancel it.
    default: false
    required: false
    visible: true
  mysql_regions:
    type: list
    valueType: mysql_region
    title: MySQL regions
    description: Add each subscribed region to include.
    required: true
  mysql_region:
    type: oci:identity:region:name
    title: MySQL region
    description: Select a region containing databases to include. Use Add Item for another region.
    required: true
    visible: false
  mysql_compartments:
    type: list
    valueType: mysql_compartment
    title: MySQL compartments
    description: Add each compartment to include. Child compartments are not automatically included.
    required: true
  mysql_compartment:
    type: oci:identity:compartment:id
    title: MySQL compartment
    description: Select child compartments separately. When editing, reselect all intended compartments if saved rows appear blank. Check Review before saving.
    required: true
    visible: false
  ownership_kind:
    type: enum
    enum: [defined, freeform]
    default: defined
    title: Tag type
    description: Match the tag on your databases. Defined tags have a namespace; freeform tags do not.
    required: true
  ownership_namespace:
    type: string
    title: Defined-tag namespace
    description: Enter the namespace containing your ownership tag, for example Operations.
    required: true
    visible:
      eq: ["${ownership_kind}", defined]
    minLength: 1
    maxLength: 100
  ownership_key:
    type: string
    title: Ownership tag key
    description: For a tag such as team=payments-api, enter team here and map payments-api to a destination below. Match the tag spelling exactly.
    required: true
    minLength: 1
    maxLength: 100
  pagerduty_region:
    type: enum
    enum: [US, EU]
    default: US
    title: PagerDuty account region
    description: Select the region of your PagerDuty account, independently of the OCI deployment region.
    required: true
  secret_compartment_ocid:
    type: oci:identity:compartment:id
    title: Vault secret compartment
    description: "Choose the compartment containing your secrets in the stack region. Reuse an existing secret or <a href='https://docs.oracle.com/en-us/iaas/Content/secret-management/Tasks/create-secret.htm'>create one in Vault</a>. These routing secrets are not read yet; PREVIEW can use harmless dummy content. TEST uses its separate secret above."
    default: ${compartment_ocid}
    required: true
  destinations:
    type: map
    valueType: destination_secret
    title: "Destinations: name → Vault secret"
    description: Give each destination a stable lowercase name, then select its existing Vault secret in the stack region. Never paste integration keys.
    required: true
  destination_secret:
    type: oci:kms:secret:id
    description: "Left: name this destination, for example payments (1–32 lowercase letters, digits or hyphens, starting with a letter or digit). Right: select its Vault secret. Never paste an integration key. When editing, reselect blank secrets and check Review before saving."
    required: true
    visible: false
    dependsOn:
      compartmentId: ${secret_compartment_ocid}
  routes:
    type: map
    valueType: destination_name
    title: "Routes: ownership tag value → destination name"
    description: Enter an exact ownership tag value and a destination name from above. Values are case-sensitive and must already use Unicode NFC; ASCII values are unaffected.
    required: true
  destination_name:
    type: string
    description: "Left: the exact tag value, for example payments-api. Right: its destination name from above, for example payments. Multiple tag values can use the same destination. Non-ASCII tag values must already use Unicode NFC."
    required: true
    visible: false
    # Terraform validates destinations; native child patterns retain errors after row removal.
  create_network:
    type: boolean
    title: Create a new network
    description: Create a private VCN, subnet and outbound gateways for OCI and PagerDuty access. Clear to use an existing VCN and private regional subnet.
    default: true
  network_cidr:
    type: string
    title: New network address range (CIDR)
    description: Address range for the new private network. Keep the default unless your network policy requires a different range.
    default: 10.77.0.0/24
    required: true
    visible: ${create_network}
  network_compartment_ocid:
    type: oci:identity:compartment:id
    title: Existing network compartment
    description: Select the compartment containing your existing VCN and subnet.
    default: ${compartment_ocid}
    required: true
    visible:
      not: ["${create_network}"]
  existing_vcn_ocid:
    type: oci:core:vcn:id
    title: Existing VCN
    description: Select the VCN containing your existing private subnet.
    required: true
    visible:
      not: ["${create_network}"]
    dependsOn:
      compartmentId: ${network_compartment_ocid}
  existing_subnet_ocid:
    type: oci:core:subnet:id
    title: Existing private regional subnet
    description: Must permit DNS and HTTPS to regional Announcements, Object Storage and Vault; TEST also needs events.pagerduty.com (US) or events.eu.pagerduty.com (EU) and, with operator email, Notifications control and topic data endpoints. Shared routes and security rules are not changed.
    required: true
    visible:
      not: ["${create_network}"]
    dependsOn:
      compartmentId: ${network_compartment_ocid}
      vcnId: ${existing_vcn_ocid}
      hidePublicSubnet: true
      hideAdSubnet: true
outputs:
  closure_completed:
    type: boolean
    title: Requested closure verified by last Apply
  closure_result:
    type: string
    visible: false
  test_receipt_confirmed:
    type: boolean
    title: PagerDuty receipt confirmed by last check
  operator_receipt_confirmed:
    type: boolean
    title: Operator email receipt confirmed by last check
  operator_subscription_status:
    type: string
    title: Operator subscription (confirm OCI's email if PENDING)
  operator_test_status:
    type: string
    title: Last operator test (API acceptance only)
  configured_mode:
    type: string
    title: Configured mode
  test_submission_status:
    type: string
    title: Last test submission (API acceptance only)
  installation_status:
    type: string
    title: Last deployment check
  sending_enabled:
    type: boolean
    title: Maintenance delivery enabled
  function_id:
    type: string
    title: Function
  state_bucket:
    type: string
    title: Protected private storage
  check_result:
    type: string
    visible: false
